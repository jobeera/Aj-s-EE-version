<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExtraaEdge EduMartech</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const applicationMode = window.location.hash === "#applications";
      if (applicationMode) {
        import("/src/application-entry.jsx");
        import("/src/application-sidebar-collapse.js");
      } else {
        import("/src/main.jsx");
        import("/src/drawer-resize-fix.js");
        window.addEventListener("click", (event) => {
          const target = event.target.closest("button");
          if (target && /applications/i.test(target.textContent || "")) {
            window.location.hash = "applications";
            window.location.reload();
          }
        }, true);
      }
      import("/src/apply-controls.js");
    </script>
  </body>
</html>
