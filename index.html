<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExtraaEdge EduMartech</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const mode = window.location.hash;
      if (mode === "#workflows") {
        import("/src/workflow-entry.jsx");
      } else if (mode === "#applications") {
        import("/src/application-entry.jsx");
        import("/src/application-sidebar-collapse.js");
        import("/src/application-view-edit.js");
      } else if (mode === "#audiences") {
        import("/src/audience-entry.jsx");
      } else if (mode === "#campaigns") {
        import("/src/campaign-entry.jsx");
      } else if (mode === "#analytics-growth") {
        import("/src/analytics-growth-entry.jsx");
      } else {
        import("/src/main.jsx");
        import("/src/drawer-resize-fix.js");
        window.addEventListener("click", (event) => {
          const target = event.target.closest("button");
          if (!target) return;
          const text = target.textContent || "";
          if (/applications/i.test(text)) { window.location.hash = "applications"; window.location.reload(); }
          if (/workflow/i.test(text)) { window.location.hash = "workflows"; window.location.reload(); }
          if (/audience/i.test(text)) { window.location.hash = "audiences"; window.location.reload(); }
          if (/campaign/i.test(text)) { window.location.hash = "campaigns"; window.location.reload(); }
        }, true);
      }
      import("/src/parity-controls.js");
      import("/src/workflow-nav.js");
      import("/src/growth-nav.js");
    </script>
  </body>
</html>
